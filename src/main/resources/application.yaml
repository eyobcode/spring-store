spring:
  application:
    name: spring-store
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/storedb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: myPassword!
  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
  web:
    error:
      include-stacktrace: never
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 7200 # 300 # 3m
    refreshTokenExpiration: 604800 # 7d
stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}

websiteUrl: http://localhost:4242

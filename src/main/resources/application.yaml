spring:
  application:
    name: spring-store
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/storedb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: myPassword!
  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
  web:
    error:
      include-stacktrace: never
  jwt:
    secret: ${JWT_SECRET}
